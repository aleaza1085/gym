<script>
(function(){'use strict';
var $=function(i){return document.getElementById(i)};
var DAYS={pecho:'Pecho',pierna:'Pierna',espalda:'Espalda'},ORDER=['pecho','pierna','espalda'],ICO={pecho:'chest',pierna:'leg',espalda:'back'};
var BASE={pecho:['Peck deck','Press plano','Curl de bíceps','JM press','Curl predicador','Extensión de tríceps','Elevaciones laterales','Fondos'],
pierna:['Crunch abdominal','Elevación de pierna','Abductores','Hip thrust en máquina','Máquina de tríceps sural','Extensión de cuádriceps','Patrón de sentadilla','Máquina de femoral'],
espalda:['Remo T','Jalón al pecho','Remo','Curl de bíceps','Curl predicador','Elevaciones laterales','Press militar con barra','Posterior','Tríceps','Peck deck']};
var P={chest:'<path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/>',leg:'<path d="M9.5 8.5a2.5 2.5 0 1 1 5 0"/><path d="M6.6 20h10.8a1 1 0 0 0 1-1.2A6.9 6.9 0 0 0 12 11a6.9 6.9 0 0 0-6.4 7.8 1 1 0 0 0 1 1.2z"/>',back:'<path d="M3 4h18M7 4v5l5 3 5-3V4M12 12v8M9 20h6"/>',home:'<path d="M4 11l8-7 8 7M6 10v10h12V10"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',chev:'<path d="M6 9l6 6 6-6"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',left:'<path d="M19 12H5M11 6l-6 6 6 6"/>',hist:'<path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 8v4l3 2"/>',prog:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',gear:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',play:'<path d="M8 5l11 7-11 7z"/>',flag:'<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'};
function ic(n){return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+P[n]+'</svg>'}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n}
function pad(n){return String(n).padStart(2,'0')}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function fd(t,l){return new Date(t).toLocaleDateString('es-CO',l?{weekday:'short',day:'numeric',month:'short'}:{day:'numeric',month:'short'})}
function ft(t){return new Date(t).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}
function mmss(s){s=Math.max(0,Math.ceil(s));return pad(Math.floor(s/60))+':'+pad(s%60)}
function hms(ms){var s=Math.floor(Math.max(0,ms)/1000),h=Math.floor(s/3600);return(h?h+':':'')+pad(Math.floor(s%3600/60))+':'+pad(s%60)}
function wr(s){var w=num(s.w),r=num(s.r);return(w===null?'—':w)+' kg × '+(r===null?'—':r)}
function sd(s){var w=num(s.w),r=num(s.r);return(w===null?'—':w)+'×'+(r===null?'—':r)}

/* ---------- almacenamiento (IndexedDB con respaldo en localStorage) ---------- */
var kind='IndexedDB',idb=null;
function openDB(){return new Promise(function(ok,no){if(!window.indexedDB)return no(new Error('IndexedDB no disponible'));var q;try{q=indexedDB.open('mi-rutina',1)}catch(e){return no(e)}q.onupgradeneeded=function(){q.result.createObjectStore('kv')};q.onsuccess=function(){idb=q.result;idb.onclose=function(){idb=null};ok(idb)};q.onerror=function(){no(q.error)}})}
function tx(mode,fn){return(idb?Promise.resolve(idb):openDB()).then(function(d){return new Promise(function(ok,no){var t=d.transaction('kv',mode),r=fn(t.objectStore('kv'));t.oncomplete=function(){ok(r&&r.result)};t.onerror=t.onabort=function(){no(t.error||new Error('Operación cancelada'))}})})}
function legacy(){try{var r=localStorage.getItem('mi-rutina-v2')||localStorage.getItem('mi-rutina-v1');if(r)return{v:JSON.parse(r),legacy:true}}catch(e){}return{v:null}}
function readStore(){return tx('readonly',function(s){return s.get('state')}).then(function(v){return v?{v:v}:legacy()}).catch(legacy)}
function writeStore(v){return tx('readwrite',function(s){return s.put(v,'state')}).then(function(){kind='IndexedDB'}).catch(function(e){try{localStorage.setItem('mi-rutina-v2',JSON.stringify(v));kind='localStorage'}catch(_){throw e}})}

/* ---------- estado ---------- */
var NS=false,fresh=false,state=null,cur='inicio',OPEN={},PF=null,DLG=null,TF=null;
function mkEx(d,n,i){return{id:d+'-b'+i,name:n,rest:180,notes:'',sets:[{w:'',r:'',d:false},{w:'',r:'',d:false}]}}
function normEx(e){var s=[],i;if(Array.isArray(e.sets))s=e.sets.map(function(x){return{w:x.w==null?'':String(x.w),r:x.r==null?'':String(x.r),d:!!x.d}});else{var n=clamp(parseInt(e.sets,10)||2,1,15);for(i=0;i<n;i++)s.push({w:e.weight==null?'':String(e.weight),r:e.reps==null?'':String(e.reps),d:!!(e.done&&e.done[i])})}
if(!s.length)s=[{w:'',r:'',d:false}];return{id:e.id||uid(),name:String(e.name||'Ejercicio'),rest:clamp(parseInt(e.rest,10)||0,0,600),notes:String(e.notes||''),sets:s.slice(0,15)}}
function normH(r){if(!r||!DAYS[r.day]||!Array.isArray(r.items))return null;var st=+r.start||+r.ts||Date.now();
return{id:r.id||uid(),day:r.day,start:st,end:+r.end||st,items:r.items.map(function(i){var ss;if(Array.isArray(i.sets))ss=i.sets.map(function(x){return{w:x.w==null?'':String(x.w),r:x.r==null?'':String(x.r)}});else{ss=[];for(var k=0;k<Math.min(15,parseInt(i.done,10)||0);k++)ss.push({w:i.weight==null?'':String(i.weight),r:i.reps==null?'':String(i.reps)})}
return{name:String(i.name||''),rest:+i.rest||0,notes:String(i.notes||''),sets:ss}}).filter(function(i){return i.sets.length})}}
function norm(s){s=s&&typeof s==='object'?s:{};var r=s.routine||s.days||{};
ORDER.forEach(function(d){r[d]=Array.isArray(r[d])?r[d].map(normEx):BASE[d].map(function(n,i){return mkEx(d,n,i)})});
var mig=s.m!==4;if(mig){NS=true;ORDER.forEach(function(d){r[d].forEach(function(e){e.rest=180;if(e.sets.length>2&&!e.sets.slice(2).some(function(x){return x.d}))e.sets=e.sets.slice(0,2);while(e.sets.length<2)e.sets.push({w:'',r:'',d:false})})})}
var o={u:+s.u||0,routine:r,history:(Array.isArray(s.history)?s.history:[]).map(normH).filter(Boolean)};
o.session=s.session&&DAYS[s.session.day]?{id:s.session.id||uid(),day:s.session.day,start:+s.session.start||Date.now()}:null;
var l=s.last;o.last=l&&typeof l==='object'&&DAYS[l.day]?{day:l.day,exId:l.exId}:(DAYS[l]?{day:l}:null);
var q=s.set||{};o.set={auto:q.auto!==undefined?!!q.auto:s.auto!==false,vib:q.vib!==false,snd:q.snd!==false,ntf:!!q.ntf};
var t=s.timer||{};o.timer={total:clamp(+t.total||180,5,5999),rem:+t.rem||0,end:+t.end||0,run:!!t.run,st:!!t.st,fin:!!t.fin,lab:String(t.lab||'')};
if(mig&&!o.timer.run){o.timer.total=o.timer.rem=180;o.timer.st=o.timer.fin=false}
if(!o.timer.rem&&!o.timer.run)o.timer.rem=o.timer.total;o.m=4;return o}
function mg(){if(NS&&state){NS=false;save()}}

/* ---------- guardado automático ---------- */
var ind=$('ind'),sT=null,seq=0,lastErr=0;
function setInd(s){ind.dataset.s=s;ind.textContent={saving:'Guardando…',saved:'Guardado en la nube',local:'Solo en el teléfono',error:'Error al guardar'}[s]}
function save(){state.u=Date.now();dirty=true;setInd('saving');clearTimeout(sT);sT=setTimeout(flush,250)}
function flush(){clearTimeout(sT);sT=null;var my=++seq;
return writeStore(state).then(function(){if(my===seq&&!sT)cloudSoon();return true}).catch(function(e){setInd('error');cloudSoon(true);if(Date.now()-lastErr>6000){lastErr=Date.now();toast('No se pudo guardar ('+(e&&e.message||'almacenamiento no disponible')+'). Exporta una copia en Ajustes.')}return false})}
window.addEventListener('pagehide',function(){if(sT)flush()});
document.addEventListener('visibilitychange',function(){if(document.hidden){if(sT)flush()}else{tick();wake();pull()}});

/* ---------- nube (JSONBin) ---------- */
var CLOUD={url:'https://api.jsonbin.io/v3/b/',id:'6ae33814ffd5d16053957b2c',key:'$2a$10$MKQ9yCGv8Iplea2MECG4l.RVrJowQSXEbUfXrEY6FIQHCIKe0LlKW'};
var cT=null,dirty=false,cBusy=false,cOK=0,cSz=0,cMsg='',lastCE=0;
function cStatus(){return(cOK?'Última sincronización: '+ft(cOK)+' · '+(cSz/1024).toFixed(1)+' KB.':'Aún sin sincronizar.')+(cMsg?' Aviso: '+cMsg:'')}
function cUpd(){var e=$('cst');if(e)e.textContent=cStatus()}
function cloud(method,body){var ac=new AbortController(),t=setTimeout(function(){ac.abort()},15000),h={'X-Master-Key':CLOUD.key};
if(method==='GET')h['X-Bin-Meta']='false';else h['Content-Type']='application/json';
return fetch(CLOUD.url+CLOUD.id+(method==='GET'?'/latest':''),{method:method,headers:h,body:body,signal:ac.signal}).then(function(r){clearTimeout(t);
if(r.ok)return r.json();return r.text().then(function(m){var e;try{e=JSON.parse(m).message}catch(_){}throw new Error(e||'Error '+r.status)})},function(e){clearTimeout(t);throw e})}
function cloudSoon(keep){clearTimeout(cT);if(!keep)setInd('saving');cT=setTimeout(push,3000)}
function cErr(e){var m=e&&e.name==='AbortError'?'tiempo de espera agotado':(e&&e.message)||'sin conexión';cMsg=m;cUpd();if(ind.dataset.s!=='error')setInd('local');
if(Date.now()-lastCE>30000){lastCE=Date.now();toast('Sin nube: '+m+'. Tus datos siguen en el teléfono.')}
if(dirty){clearTimeout(cT);cT=setTimeout(push,20000)}}
function push(){clearTimeout(cT);cT=null;if(cBusy){cT=setTimeout(push,1500);return}
if(fresh){cBusy=true;cloud('GET').then(function(r){cBusy=false;var rec=r&&r.record&&!r.routine?r.record:r;fresh=false;if(rec&&(rec.routine||rec.days||rec.history)&&(+rec.u||0)>0&&!state.history.length){state=norm(rec);writeStore(state).catch(function(){});route(true);paintT();dirty=false;setInd('saved');toast('Datos recuperados de la nube');mg()}else push()}).catch(function(e){cBusy=false;cErr(e)});return}
cBusy=true;var u=state.u,body=JSON.stringify(Object.assign({app:'mi-rutina',v:2},state));
cloud('PUT',body).then(function(){cBusy=false;cOK=Date.now();cSz=body.length;cMsg='';if(state.u===u){dirty=false;setInd('saved')}else cloudSoon();cUpd()}).catch(function(e){cBusy=false;cErr(e)})}
function pull(){if(!state||dirty||cBusy||sT)return Promise.resolve();
return cloud('GET').then(function(r){var rec=r&&r.record&&!r.routine?r.record:r;
if(!rec||(!rec.routine&&!rec.days&&!rec.history)){dirty=true;push();return}
cOK=Date.now();cMsg='';fresh=false;var cu=+rec.u||0;
if(cu>state.u){state=norm(rec);writeStore(state).catch(function(){});setInd('saved');route(true);paintT();toast('Datos actualizados desde la nube')}
else if(cu<state.u){dirty=true;push()}else setInd('saved');cUpd();mg()}).catch(cErr)}
window.addEventListener('online',function(){if(dirty)push();else pull()});
window.addEventListener('pagehide',function(){if(dirty&&state&&!cBusy){try{fetch(CLOUD.url+CLOUD.id,{method:'PUT',keepalive:true,headers:{'X-Master-Key':CLOUD.key,'Content-Type':'application/json'},body:JSON.stringify(Object.assign({app:'mi-rutina',v:2},state))}).catch(function(){})}catch(e){}}});

/* ---------- cálculos ---------- */
function ds(d){var t=0,n=0,f=0,l=state.routine[d];l.forEach(function(e){var k=e.sets.filter(function(s){return s.d}).length;t+=e.sets.length;n+=k;if(k===e.sets.length)f++});return{t:t,d:n,n:l.length,f:f,p:t?Math.round(n/t*100):0}}
function curEx(d){var l=state.routine[d],id=state.last&&state.last.day===d?state.last.exId:null,pend=function(e){return e.sets.some(function(s){return!s.d})};
return l.find(function(e){return e.id===id&&pend(e)})||l.find(pend)||l[0]||{id:''}}
function lastRec(d,name){for(var i=state.history.length-1;i>=0;i--){var h=state.history[i];if(h.day!==d)continue;for(var j=0;j<h.items.length;j++)if(h.items[j].name===name)return{h:h,it:h.items[j]}}return null}
function prevV(d,ex){var r=lastRec(d,ex.name);return r?'Anterior · '+fd(r.h.start)+': '+r.it.sets.map(sd).join(' · '):'Sin registro anterior'}
function sum(ex){var k=ex.sets.filter(function(s){return s.d}).length,nx=ex.sets.find(function(s){return!s.d});return nx?'Siguiente '+wr(nx)+' · faltan '+(ex.sets.length-k):'Completado · '+ex.sets.length+' series'}
function snap(){return JSON.stringify({r:state.routine,s:state.session,l:state.last})}
function restore(u){var o=JSON.parse(u);state.routine=o.r;state.session=o.s;state.last=o.l;save();route(true)}

/* ---------- vistas ---------- */
var app=$('app');
function ring(p,s){var C=2*Math.PI*18;return'<span class="rg" style="--s:'+s+'px" role="img" aria-label="'+p+' por ciento"><svg viewBox="0 0 44 44"><circle class="r0" cx="22" cy="22" r="18"/><circle class="r1" cx="22" cy="22" r="18" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-p/100)).toFixed(1)+'"/></svg><b class="tn">'+p+'</b></span>'}
function updChip(){var s=state&&state.session,c=$('chip');if(!c)return;if(!s){c.hidden=true;return}var d=ds(s.day);c.hidden=false;c.innerHTML=ic('timer').replace('class="i"','class="i" style="width:15px;height:15px"')+'<span class="tn" data-el>'+hms(Date.now()-s.start)+'</span><span>'+d.p+'%</span>'}
function hap(n){try{if(state.set.vib&&navigator.vibrate)navigator.vibrate(n)}catch(e){}}
function sub(t){return'<div class="sub"><a class="back" href="#inicio" aria-label="Volver al inicio">'+ic('left')+'</a><h1>'+t+'</h1></div>'}
function empty(t,p){return'<div class="c empty"><b>'+t+'</b><span>'+p+'</span></div>'}
function greet(){var h=new Date().getHours();return h<6?'Buenas noches':h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches'}
function homeV(){var s=state.session,h=state.history,lh=h[h.length-1],tot=0,i;h.forEach(function(r){r.items.forEach(function(x){tot+=x.sets.length})});
var day=s?s.day:state.last?state.last.day:lh?lh.day:'pecho',d=ds(day),hero;
var today=new Date().toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
if(s)hero='<div class="row" style="align-items:center"><div><p class="mut">Sesión en curso · '+DAYS[s.day]+'</p><div class="big tn" data-el>'+hms(Date.now()-s.start)+'</div><p class="mut tn">'+d.d+' de '+d.t+' series</p></div>'+ring(d.p,96)+'</div>';
else hero='<p class="mut">'+(lh?'Último día trabajado: '+DAYS[lh.day]+' · '+fd(lh.start,true):'Aún no has finalizado ningún entrenamiento')+'</p>';
var cards=ORDER.map(function(k){var x=ds(k);return'<button class="c dc" data-a="go" data-day="'+k+'"><div class="row"><span class="ico">'+ic(ICO[k])+'</span>'+ring(x.p,54)+'</div><h2>'+DAYS[k]+'</h2><p class="mut tn">'+x.n+' ejercicios · '+x.d+'/'+x.t+' series</p></button>'}).join('');
return'<section class="v"><div class="hd"><h1>Mi rutina</h1><p>'+greet()+' · '+esc(today)+'</p></div><div class="c hero">'+hero+'<button class="go" data-a="cur-go"><span>'+(s?'Continuar':(state.last||lh?'Continuar · ':'Empezar · ')+DAYS[day])+'</span>'+ic('arrow')+'</button></div>'+
'<div class="stats" style="margin-bottom:14px"><div><b class="tn">'+h.length+'</b><span>Entrenos</span></div><div><b class="tn">'+tot+'</b><span>Series totales</span></div><div><b class="tn">'+(ds('pecho').n+ds('pierna').n+ds('espalda').n)+'</b><span>Ejercicios</span></div></div>'+cards+
'<div class="ql"><a class="b g" href="#historial">'+ic('hist')+'Historial</a><a class="b g" href="#progreso">'+ic('prog')+'Progreso</a><a class="b g" href="#ajustes">'+ic('gear')+'Ajustes</a></div></section>'}
function sessV(day){var s=state.session,d=ds(day);
if(!s)return'<div class="c hero"><div><p>Sin sesión activa</p><p class="mut" style="font-size:14px">Al completar una serie la sesión empieza sola, o puedes iniciarla ahora.</p></div><button class="b w" data-a="start">'+ic('play')+'Iniciar sesión</button></div>';
if(s.day!==day)return'<div class="c hero"><p>Hay una sesión activa en <b>'+DAYS[s.day]+'</b>.</p><button class="b w" data-a="go" data-day="'+s.day+'">Ir a '+DAYS[s.day]+'</button></div>';
return'<div class="c hero"><div class="row"><span class="big tn" data-el>'+hms(Date.now()-s.start)+'</span><span class="mut tn" style="text-align:right">Inicio '+ft(s.start)+'<br>'+d.p+'%</span></div><div class="bar live"><i style="width:'+d.p+'%"></i></div><p class="mut tn" style="font-size:14px">'+d.d+' de '+d.t+' series · '+d.f+' de '+d.n+' ejercicios · faltan '+(d.n-d.f)+'</p><div class="two"><button class="b g" data-a="cur" data-id="'+esc(curEx(day).id)+'">Ejercicio actual</button><button class="b" data-a="fin">'+ic('flag')+'Finalizar</button></div></div>'}
function sessRefresh(day){updChip();var e=$('sess');if(e&&cur===day)e.innerHTML=sessV(day)}
